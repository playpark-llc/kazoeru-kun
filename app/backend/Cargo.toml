[package]
name = "opt"
version = "0.1.0"
edition = "2021"


[dependencies]
serde = "1.0.200"
rocket = { version = "0.5.1", features = ["secrets", "tls", "json"] }
futures = "0.3.30"
tokio = "1.38.0"
redis-async = "0.17.2"
deadpool-redis = "0.15.1"
rand = "0.8.5"
sea-orm = { version = "1.1.0", features = [
  "sqlx-mysql",
  "runtime-tokio-native-tls",
  "macros",
] }
chrono = "0.4.38"
chrono-tz = "0.8"
rocket_cors = "0.6.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
