services:
  back:
    build: ./app/backend
    command: sh -c "cargo watch -x 'run'"
    tty: true
    working_dir: /backend
    env_file:
      - ./app/backend/.env
    volumes:
      - type: bind
        source: ./app/backend
        target: /backend
      - target_backend:/backend/target
      - target_migration:/backend/migration/target
    ports:
      - 8881:8000
    depends_on:
      - redis
      - db

  frontend2:
    build: ./app/frontend2
    # command: sh -c "npm run dev"
    tty: true
    working_dir: /opt/app/frontend2/yew-app
    volumes:
      - ./app/frontend2:/opt/app/frontend2
    ports:
      - 3001:8080
    depends_on:
      - back

  redis:
    image: redis:7.2.3-alpine3.19
    volumes:
      - ./redis-data:/data
    ports:
      - 6380:6379

  db:
    image: mysql:8.3.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=admin_password
      - MYSQL_DATABASE=KazoeruKun
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
      - TZ=Asia/Tokyo
    volumes:
      - ./mysql/store:/var/lib/mysql
      - type: bind
        source: ./mysql/conf
        target: /etc/mysql/conf.d
    ports:
      - 7776:3306
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$MYSQL_ROOT_PASSWORD",
        ]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 3s

  cron:
    build: ./cron
    tty: true
    working_dir: /cron
    volumes:
      - type: bind
        source: ./cron
        target: /cron

  tbls: # create table documents when db healthcheck passed
    image: ghcr.io/k1low/tbls
    working_dir: /tbls
    volumes:
      - ./doc:/tbls/doc
      - ./.tbls.yml:/tbls/.tbls.yml
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      tbls doc -f --rm-dist
    tty: true

volumes:
  pnpm_store_frontend:
  node_modules_frontend:
  target_backend:
  target_migration:
