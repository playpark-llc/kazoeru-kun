services:
  front:
    build: ./app/frontend
    tty: true
    volumes:
      - ./app/frontend:/opt/app/frontend
      - node_modules_frontend:/opt/app/frontend/node_modules
      - pnpm_store_frontend:/opt/app/frontend/.pnpm-store
    ports:
      - 3000:3000
    depends_on:
      - back

  back:
    build: ./app/backend
    command: sh -c "cargo watch -x 'run'"
    tty: true
    working_dir: /backend
    env_file:
      - ./app/backend/.env
    volumes:
      - type: bind
        source: ./app/backend
        target: /backend
      - target_backend:/backend/target
      - target_migration:/backend/migration/target
    ports:
      - 8881:8000
    depends_on:
      - redis
      - db

  redis:
    image: redis:7.2.3-alpine3.19
    volumes:
      - ./redis-data:/data

  db:
    image: mysql:8.3.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=admin_password
      - MYSQL_DATABASE=KazoeruKun
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
      - TZ=Asia/Tokyo
    volumes:
      - ./mysql/store:/var/lib/mysql
      - type: bind
        source: ./mysql/conf
        target: /etc/mysql/conf.d
    ports:
      - 7776:3306
    tty: true

  cron:
    build: ./cron
    tty: true

volumes:
  pnpm_store_frontend:
  node_modules_frontend:
  target_backend:
  target_migration:
