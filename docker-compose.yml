services:
  back:
    build: ./app/backend
    command: sh -c "cargo watch -x 'run'"
    tty: true
    working_dir: /backend
    env_file:
      - ./app/backend/.env
    volumes:
      - type: bind
        source: ./app/backend
        target: /backend
      - target_backend:/backend/target
      - target_migration:/backend/migration/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-dir:/opt/app/backend/target
    ports:
      - 8881:8000
    depends_on:
      - redis
      - db

  frontend:
    build: ./app/frontend
    command: sh -c "npm run dev"
    tty: true
    working_dir: /opt/app/frontend/yew-app
    volumes:
      - ./app/frontend:/opt/app/frontend
    ports:
      - 3001:8080
    depends_on:
      - back

  redis:
    image: redis:7.2.3-alpine3.19
    volumes:
      - ./redis-data:/data
    ports:
      - 6380:6379

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin_password}
      - POSTGRES_DB=kazoerukun
      - TZ=Asia/Tokyo
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 3s

  tbls: # create table documents when db healthcheck passed
    image: ghcr.io/k1low/tbls
    working_dir: /tbls
    volumes:
      - ./doc:/tbls/doc
      - ./.tbls.yml:/tbls/.tbls.yml
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      tbls doc -f --rm-dist
    tty: true

  # Note: Cron service removed as it's now integrated into the backend via tokio::spawn

volumes:
  pnpm_store_frontend:
  node_modules_frontend:
  target_backend:
  target_migration:
  cargo-registry:
  cargo-git:
  target-dir:
