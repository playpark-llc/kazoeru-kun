# Fly.io Application Configuration
app = "kazoeru-kun"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "app/backend/Dockerfile.prod"

[env]
  ROCKET_ADDRESS = "0.0.0.0"
  ROCKET_PORT = "8080"
  ROCKET_PROFILE = "production"
  RUST_LOG = "info"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

  [[services.http_checks]]
    interval = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    restart_limit = 0
    timeout = "2s"
    tls_skip_verify = false
    [services.http_checks.headers]