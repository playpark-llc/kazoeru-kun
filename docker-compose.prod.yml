version: '3.8'

services:
  back:
    build:
      context: ./app/backend
      dockerfile: Dockerfile.prod
    image: kazoeru-kun-backend-prod:latest
    container_name: kazoeru-kun-backend-prod
    ports:
      - "8881:8881"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8881
      - ROCKET_PROFILE=production
      - RUST_LOG=info
    env_file:
      - .env.production
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.prod
    image: kazoeru-kun-frontend-prod:latest
    container_name: kazoeru-kun-frontend-prod
    ports:
      - "3001:80"
    environment:
      - APP_API_ROOT=http://backend:8881
    depends_on:
      - back
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  kazoeru-network:
    driver: bridge