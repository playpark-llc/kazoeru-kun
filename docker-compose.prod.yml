version: '3.8'

services:
  back:
    build:
      context: ./app/backend
      dockerfile: Dockerfile.prod
    image: kazoeru-kun-backend-prod:latest
    container_name: kazoeru-kun-backend-prod
    ports:
      - "8881:8881"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8881
      - ROCKET_PROFILE=production
      - RUST_LOG=info
    env_file:
      - ./app/backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.prod
    image: kazoeru-kun-frontend-prod:latest
    container_name: kazoeru-kun-frontend-prod
    ports:
      - "3001:80"
    environment:
      - APP_API_ROOT=http://backend:8881
    depends_on:
      - back
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  db:
    image: mysql:8.0
    container_name: kazoeru-kun-mysql-prod
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-admin_password}
      - MYSQL_DATABASE=KazoeruKun
      - MYSQL_USER=${DB_USER:-kazoeru_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-kazoeru_password}
    ports:
      - "7776:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - kazoeru-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kazoeru-kun-redis-prod
    ports:
      - "6380:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - kazoeru-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: kazoeru-kun-cron-prod
    depends_on:
      - back
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  kazoeru-network:
    driver: bridge

volumes:
  mysql_data_prod:
    driver: local
  redis_data_prod:
    driver: local