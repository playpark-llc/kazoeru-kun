version: '3.8'

services:
  back:
    build:
      context: ./app/backend
      dockerfile: Dockerfile.prod
    image: kazoeru-kun-backend-prod:latest
    container_name: kazoeru-kun-backend-prod
    ports:
      - "8881:8881"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8881
      - ROCKET_PROFILE=production
      - RUST_LOG=info
    env_file:
      - ./app/backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.prod
    image: kazoeru-kun-frontend-prod:latest
    container_name: kazoeru-kun-frontend-prod
    ports:
      - "3001:80"
    environment:
      - APP_API_ROOT=http://backend:8881
    depends_on:
      - back
    networks:
      - kazoeru-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  db:
    image: postgres:15-alpine
    container_name: kazoeru-kun-postgres-prod
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin_password}
      - POSTGRES_DB=kazoerukun
      - POSTGRES_USER=${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - kazoeru-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kazoeru-kun-redis-prod
    ports:
      - "6380:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - kazoeru-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  kazoeru-network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local